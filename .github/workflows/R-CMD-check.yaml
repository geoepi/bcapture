name: R-CMD-check

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pypdf
      - name: Verify Python dependencies
        run: |
          python --version
          python -c "import pypdf; print('pypdf', pypdf.__version__)"
      - name: Configure reticulate Python
        shell: Rscript {0}
        run: |
          python <- Sys.which("python")
          if (!nzchar(python)) {
            stop("Python executable was not found on PATH.")
          }
          cat(
            paste0(
              "RETICULATE_PYTHON=",
              normalizePath(python, winslash = "/"),
              "\n"
            ),
            file = Sys.getenv("GITHUB_ENV"),
            append = TRUE
          )
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::rcmdcheck
          needs: check
      - name: Document
        run: Rscript -e 'devtools::document()'
      - name: Test
        run: Rscript -e 'devtools::test()'
      - uses: r-lib/actions/check-r-package@v2
